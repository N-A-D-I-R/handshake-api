name: Deploy Handshake Database to Production
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy Database
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DB_SERVER_IP }}
          username: ${{ secrets.DB_SERVER_USER }}
          key: ${{ secrets.DB_SERVER_SSH_KEY }}
          source: "compose.database.yaml"
          target: "/home/deploy/handshake-db"

      - name: Deploy PostgreSQL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DB_SERVER_IP }}
          username: ${{ secrets.DB_SERVER_USER }}
          key: ${{ secrets.DB_SERVER_SSH_KEY }}

          script: |
            cd /home/deploy/handshake-db

            cat > .env <<EOF
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            EOF

            docker compose -f compose.database.yaml up -d --remove-orphans