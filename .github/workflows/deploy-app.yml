name: Build Image and Deploy API

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/n-a-d-i-r/handshake-api
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy infrastructure files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          source: "compose.prod.yaml,nginx.conf"
          target: "/home/deploy/handshake-api"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}

          script: |

            APP_DIR="/home/deploy/handshake-api"

            mkdir -p $APP_DIR/certbot/conf
            mkdir -p $APP_DIR/certbot/www

            cat > $APP_DIR/.env <<ENVEOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }}

            SMTP_SERVER=${{ vars.SMTP_SERVER }}
            SMTP_PORT=${{ vars.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}

            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}

            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}

            ACCESS_TOKEN_EXPIRATION=${{ vars.ACCESS_TOKEN_EXPIRATION }}
            REFRESH_TOKEN_EXPIRATION=${{ vars.REFRESH_TOKEN_EXPIRATION }}
            CODE_EXPIRATION=${{ vars.CODE_EXPIRATION }}

            SQL_LOGGING=${{ vars.SQL_LOGGING }}
            DEBUG=${{ vars.DEBUG }}
            ENVEOF

            echo "Checking SSL certificate..."
            CERT="$APP_DIR/certbot/conf/live/api.handshake.aucool.com/fullchain.pem"

            echo "PHASE 1 - SSL bootstrap"
            if [ ! -f "$CERT" ]; then
              echo "SSL certificate missing. Starting temporary nginx"
              docker rm -f handshake-nginx-temp || true
              mkdir -p $APP_DIR/nginx-temp

              cat > $APP_DIR/nginx-temp/default.conf <<NGINXEOF
              server {

                  listen 80;
                  server_name api.handshake.aucool.com;
                  location /.well-known/acme-challenge/ {
                      root /var/www/certbot;
                  }

                  location / {
                      return 200 "temporary nginx";
                  }

              }
              NGINXEOF

              docker run -d \
                --name handshake-nginx-temp \
                -p 80:80 \
                -v $APP_DIR/nginx-temp/default.conf:/etc/nginx/conf.d/default.conf:ro \
                -v $APP_DIR/certbot/www:/var/www/certbot \
                nginx:1.25

              echo "Requesting certificate"
              docker run --rm \
                -v $APP_DIR/certbot/conf:/etc/letsencrypt \
                -v $APP_DIR/certbot/www:/var/www/certbot \
                certbot/certbot certonly \
                --webroot \
                --webroot-path=/var/www/certbot \
                -d api.handshake.aucool.com \
                --email ${{ secrets.LE_EMAIL }} \
                --agree-tos \
                --no-eff-email

              docker rm -f handshake-nginx-temp

            else
              echo "Certificate exists. Renew check"
              docker run --rm \
                -v $APP_DIR/certbot/conf:/etc/letsencrypt \
                certbot/certbot renew

            fi

            echo "PHASE 2 - Application deploy"
            echo "Login GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            cd $APP_DIR

            echo "Pull images"
            docker compose -f compose.prod.yaml pull

            echo "Start production stack"
            docker compose -f compose.prod.yaml up -d --remove-orphans

            echo "Reload nginx"
            docker exec handshake-nginx nginx -s reload || true