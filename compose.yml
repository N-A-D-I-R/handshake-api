services:
  postgres:
    image: postgres:17
    container_name: handshake-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7
    container_name: handshake-redis
    ports:
      - "6379:6379"
  
  backend:
    build: .
    container_name: handshake-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: