services:
  redis:
    image: redis:7
    restart: always
    container_name: handshake-redis
  
  nginx:
    image: nginx:1.25
    restart: always
    container_name: handshake-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - certbot
  
  certbot:
    image: certbot/certbot
    restart: always
    container_name: handshake-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
  
  backend:
    image: ghcr.io/n-a-d-i-r/handshake-api:latest
    restart: always
    container_name: handshake-api
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - redis