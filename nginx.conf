server {

    listen 443 ssl;

    server_name api.handshake.aucool.com;

    ssl_certificate /etc/letsencrypt/live/api.handshake.aucool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.handshake.aucool.com/privkey.pem;


    location / {
        proxy_pass http://backend:8000;
    }
}


server {
    listen 80;

    server_name api.handshake.aucool.com;

    return 301 https://$host$request_uri;
}